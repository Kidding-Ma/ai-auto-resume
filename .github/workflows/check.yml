name: Check public project
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/resume.py privacy


  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install PDF layout test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-lang-chinese texlive-fonts-recommended tex-gyre fonts-texgyre
          python -m pip install PyMuPDF Pillow
      - name: Check page-centred names with JPG, PNG and no photo
        run: python -m unittest discover -s tests -v

  layout-macos:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install a small TeX environment for macOS tests
        run: |
          if ! test -x /Library/TeX/texbin/xelatex; then
            brew install --cask basictex
          fi
          echo "/Library/TeX/texbin" >> "$GITHUB_PATH"
          sudo /Library/TeX/texbin/tlmgr update --self
          sudo /Library/TeX/texbin/tlmgr install xetex ctex fandol tex-gyre xltxtra xifthen titlesec enumitem hyperref
          python -m pip install PyMuPDF Pillow
      - name: Check macOS template, text extraction and layout
        run: python -m unittest discover -s tests -v
